<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沙特 - 慶祝教師節與生日</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti 禮花效果 -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: '#FAF6F0',
                        gold: {
                            100: '#FBF4E2',
                            300: '#E5C887',
                            500: '#D4AF37',
                            600: '#B89428',
                        },
                        rose: {
                            50: '#FFF5F5',
                            100: '#FED7D7',
                            400: '#F6AD55',
                            500: '#E53E3E',
                        },
                        purple: {
                            50: '#F8F5FF',
                            100: '#E9D8FD',
                            500: '#805AD5',
                            700: '#553C9A',
                        }
                    },
                    fontFamily: {
                        serif: ['"Noto Serif TC"', 'serif'],
                        rounded: ['"Zen Maru Gothic"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            background: linear-gradient(135deg, #FAF6F0 0%, #F5EBE6 50%, #EBD9ED 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 背景流動光暈 */
        .bg-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.15) 0%, rgba(233, 216, 253, 0.2) 40%, rgba(255, 255, 255, 0) 70%);
            filter: blur(40px);
            pointer-events: none;
            z-index: 0;
            animation: floatGlow 12s ease-in-out infinite alternate;
        }

        @keyframes floatGlow {
            0% { transform: translate(-10%, -10%) scale(1); }
            100% { transform: translate(20%, 20%) scale(1.15); }
        }

        /* 3D 翻頁卡片 */
        .perspective-1200 {
            perspective: 1200px;
        }

        .card-inner {
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-style: preserve-3d;
        }

        .card-inner.is-open {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .card-back {
            transform: rotateY(180deg);
        }

        /* 金色柔光文字 */
        .gold-text-gradient {
            background: linear-gradient(135deg, #B89428 0%, #D4AF37 50%, #F3E5AB 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 印章特效 */
        .seal-stamp {
            background: radial-gradient(circle, #d9463e 0%, #a8231c 100%);
            box-shadow: 0 4px 15px rgba(168, 35, 28, 0.4), inset 0 2px 4px rgba(255,255,255,0.4);
        }

        /* 自訂滾動條 */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.02);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(212, 175, 55, 0.4);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(212, 175, 55, 0.7);
        }
    </style>
</head>
<body class="relative flex flex-col justify-between items-center min-h-screen text-gray-800 p-4 sm:p-6 select-none">

    <!-- 背景光暈 -->
    <div class="bg-glow top-0 left-0"></div>
    <div class="bg-glow bottom-0 right-0" style="animation-delay: -6s;"></div>

    <!-- 花瓣動畫 Canvas -->
    <canvas id="petalsCanvas" class="fixed inset-0 pointer-events-none z-10"></canvas>

    <!-- 頂部列 -->
    <header class="w-full max-w-4xl z-20 flex flex-wrap justify-between items-center gap-3 py-2.5 px-4 bg-white/70 backdrop-blur-md rounded-2xl shadow-sm border border-white/80">
        <div class="flex items-center space-x-2">
            <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-gold-500 to-amber-200 flex items-center justify-center text-white shadow-md">
                <i class="fa-solid font-serif text-sm">恩</i>
            </div>
            <span class="font-serif font-bold text-gray-800 tracking-wide text-xs sm:text-sm">
                祝所有老師教師節快樂，祝雷麗（Let it go!）與珆亘（毛利小蟑螂）生日快樂
            </span>
        </div>

        <div class="flex items-center space-x-2 sm:space-x-3">
            <!-- 背景音樂開關 -->
            <button id="musicBtn" onclick="toggleMusic()" class="flex items-center space-x-1.5 px-3 py-1.5 rounded-full bg-white/80 hover:bg-gold-100 text-gold-600 transition-all border border-gold-300/50 shadow-sm text-xs">
                <i id="musicIcon" class="fa-solid fa-music"></i>
                <span id="musicText">播放音樂</span>
            </button>

            <!-- 編輯姓名彈窗按鈕 -->
            <button onclick="openEditModal()" class="flex items-center space-x-1 px-3 py-1.5 rounded-full bg-gold-500 hover:bg-gold-600 text-white transition-all shadow-sm text-xs">
                <i class="fa-solid fa-pen-to-square"></i>
                <span>客製祝福</span>
            </button>
        </div>
    </header>

    <!-- 主卡片區域 -->
    <main class="w-full max-w-xl my-auto z-20 py-6">
        <div class="perspective-1200 w-full h-[500px] sm:h-[540px]">
            <div id="cardInner" class="card-inner relative w-full h-full">

                <!-- ================= 封面 / 信封正面 ================= -->
                <div class="card-front absolute inset-0 w-full h-full bg-gradient-to-br from-amber-50 via-cream to-purple-50 rounded-3xl p-6 sm:p-10 border-2 border-gold-300/60 shadow-2xl flex flex-col justify-between items-center text-center cursor-pointer hover:shadow-gold-500/20 transition-all group" onclick="toggleCard(true)">
                    
                    <!-- 裝飾角花 -->
                    <div class="absolute top-4 left-4 border-t-2 border-l-2 border-gold-500/40 w-6 h-6 rounded-tl-lg"></div>
                    <div class="absolute top-4 right-4 border-t-2 border-r-2 border-gold-500/40 w-6 h-6 rounded-tr-lg"></div>
                    <div class="absolute bottom-4 left-4 border-b-2 border-l-2 border-gold-500/40 w-6 h-6 rounded-bl-lg"></div>
                    <div class="absolute bottom-4 right-4 border-b-2 border-r-2 border-gold-500/40 w-6 h-6 rounded-br-lg"></div>

                    <!-- 標題 -->
                    <div class="mt-2">
                        <span class="inline-block px-3 py-1 rounded-full bg-gold-100 text-gold-600 font-serif text-xs tracking-widest uppercase mb-2 border border-gold-300/40">
                            Special Blessing
                        </span>
                        <h2 class="text-xs text-gray-400 tracking-widest font-serif">致</h2>
                        <h1 id="coverTeacherName" class="text-2xl sm:text-3xl font-serif font-bold text-gray-800 mt-1 mb-1 tracking-wide gold-text-gradient">
                            敬愛的老師
                        </h1>
                    </div>

                    <!-- 火漆印章視覺焦點 -->
                    <div class="my-4 relative flex items-center justify-center">
                        <div class="absolute inset-0 rounded-full bg-gold-400/20 animate-ping"></div>
                        <div class="seal-stamp w-24 h-24 sm:w-28 sm:h-28 rounded-full flex flex-col items-center justify-center text-white border-4 border-amber-200/60 shadow-xl group-hover:scale-105 transition-transform duration-300">
                            <i class="fa-solid fa-cake-candles text-xl mb-1"></i>
                            <span class="font-serif font-bold text-xs tracking-wider">雙重祝願</span>
                            <span class="text-[9px] opacity-80 font-serif mt-0.5">Click to Open</span>
                        </div>
                    </div>

                    <!-- 提示文字 -->
                    <div class="mb-2">
                        <p class="text-xs sm:text-sm text-gray-600 font-serif tracking-widest flex items-center justify-center gap-2">
                            <span>✦ 點擊開啟尊屬賀卡 ✦</span>
                        </p>
                        <p class="text-[11px] text-gray-400 mt-1">桃李芬芳 · 歲歲歡愉</p>
                    </div>
                </div>

                <!-- ================= 信件內頁 / 卡片背面 ================= -->
                <div class="card-back absolute inset-0 w-full h-full bg-white/95 backdrop-blur-md rounded-3xl p-6 sm:p-8 border-2 border-gold-300/80 shadow-2xl flex flex-col justify-between text-left">
                    
                    <!-- 頁首：分頁切換與關閉按鈕 -->
                    <div class="flex justify-between items-center border-b border-gray-100 pb-3">
                        <div class="flex space-x-1 bg-cream/80 p-1 rounded-xl border border-gold-100">
                            <button onclick="switchTab('both')" id="tab-both" class="tab-btn px-2.5 py-1 text-xs rounded-lg font-serif transition-all bg-gold-500 text-white shadow-sm">
                                雙重祝福
                            </button>
                            <button onclick="switchTab('teacher')" id="tab-teacher" class="tab-btn px-2.5 py-1 text-xs rounded-lg font-serif transition-all text-gray-600 hover:text-gold-600">
                                教師節
                            </button>
                            <button onclick="switchTab('birthday')" id="tab-birthday" class="tab-btn px-2.5 py-1 text-xs rounded-lg font-serif transition-all text-gray-600 hover:text-gold-600">
                                生日祝願
                            </button>
                        </div>

                        <button onclick="toggleCard(false)" class="w-8 h-8 rounded-full bg-gray-100 hover:bg-gold-100 text-gray-400 hover:text-gold-600 flex items-center justify-center transition-all">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>

                    <!-- 賀卡內頁文字 -->
                    <div class="flex-1 my-3 overflow-y-auto pr-1">
                        <div class="mb-3">
                            <h3 id="displayTeacherName" class="text-lg sm:text-xl font-serif font-bold text-gray-800 border-b-2 border-gold-300/40 inline-block pb-1">
                                敬愛的老師：
                            </h3>
                        </div>

                        <div id="cardContent" class="font-serif leading-relaxed text-gray-700 text-xs sm:text-sm space-y-3">
                            <!-- JS 動態渲染 -->
                        </div>
                    </div>

                    <!-- 頁腳與互動禮花 -->
                    <div class="border-t border-gray-100 pt-3 flex justify-between items-end">
                        <div>
                            <p class="text-[11px] text-gray-400 font-serif">祝願您</p>
                            <p class="text-xs sm:text-sm font-serif font-bold text-gold-600">教安常樂 · 歲歲平安</p>
                        </div>

                        <button onclick="triggerConfetti(event)" class="px-3.5 py-1.5 rounded-full bg-gradient-to-r from-amber-400 to-gold-500 hover:from-amber-500 hover:to-gold-600 text-white text-xs font-serif shadow-md transition-all flex items-center gap-1.5 active:scale-95">
                            <i class="fa-solid fa-wand-magic-sparkles text-xs"></i>
                            <span>獻上祝福禮花</span>
                        </button>
                    </div>

                </div>

            </div>
        </div>
    </main>

    <footer class="z-20 text-center text-xs text-gray-400 font-serif my-2">
        <p>沙特 - 獻給最敬愛的老師與壽星</p>
    </footer>

    <!-- 客製化編輯彈窗 -->
    <div id="editModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-gold-200">
            <div class="flex justify-between items-center border-b pb-3 mb-4">
                <h3 class="font-serif font-bold text-base text-gray-800">客製化專屬祝福內容</h3>
                <button onclick="closeEditModal()" class="text-gray-400 hover:text-gray-600">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div class="space-y-3 font-serif">
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">對象稱謂：</label>
                    <input type="text" id="inputTeacherName" class="w-full px-3 py-2 border border-gray-200 rounded-xl focus:outline-none focus:border-gold-500 text-xs sm:text-sm" placeholder="例：敬愛的老師">
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">教師節祝福語：</label>
                    <textarea id="inputTeacherText" rows="3" class="w-full px-3 py-2 border border-gray-200 rounded-xl focus:outline-none focus:border-gold-500 text-xs sm:text-sm" placeholder="感謝老師傳道授業..."></textarea>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1">生日祝願語：</label>
                    <textarea id="inputBirthdayText" rows="3" class="w-full px-3 py-2 border border-gray-200 rounded-xl focus:outline-none focus:border-gold-500 text-xs sm:text-sm" placeholder="祝福生日快樂..."></textarea>
                </div>
            </div>

            <div class="mt-5 flex justify-end space-x-2">
                <button onclick="closeEditModal()" class="px-4 py-1.5 rounded-xl text-xs text-gray-500 hover:bg-gray-100 font-serif">取消</button>
                <button onclick="saveCustomContent()" class="px-4 py-1.5 rounded-xl bg-gold-500 hover:bg-gold-600 text-white text-xs font-serif shadow-md">儲存更新</button>
            </div>
        </div>
    </div>

    <script>
        // --- 預設資料（修正原本語法缺失問題）---
        let currentTab = 'both';
        let cardData = {
            name: "敬愛的老師",
            teacherText: "感謝您如明燈般的指引，用智慧與耐心滋養我們的成長。值此教師節，願您工作順心、教安常樂！",
            birthdayText: "特別祝福雷麗（Let it go!）與珆亘（毛利小蟑螂）生日快樂！願新的一歲平安喜樂，諸事順遂，所有美好如期而至！"
        };

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            renderContent();
            initPetals();
        });

        // --- 卡片翻轉邏輯 ---
        function toggleCard(isOpen) {
            const cardInner = document.getElementById('cardInner');
            if (isOpen) {
                cardInner.classList.add('is-open');
                playBellSound();
                setTimeout(() => triggerConfetti(), 400);
            } else {
                cardInner.classList.remove('is-open');
            }
        }

        // --- 頁籤切換 ---
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-gold-500', 'text-white', 'shadow-sm');
                btn.classList.add('text-gray-600');
            });
            const activeBtn = document.getElementById(`tab-${tab}`);
            activeBtn.classList.add('bg-gold-500', 'text-white', 'shadow-sm');
            activeBtn.classList.remove('text-gray-600');

            renderContent();
        }

        // --- 內容渲染 ---
        function renderContent() {
            const container = document.getElementById('cardContent');
            let html = '';

            if (currentTab === 'both' || currentTab === 'teacher') {
                html += `
                <div class="p-3 bg-amber-50/70 rounded-xl border-l-4 border-gold-500 shadow-sm">
                    <p class="font-bold text-gold-600 text-xs mb-1 flex items-center gap-1.5">
                        <i class="fa-solid fa-graduation-cap"></i> 教師節致意
                    </p>
                    <p class="leading-relaxed">${cardData.teacherText}</p>
                </div>`;
            }

            if (currentTab === 'both' || currentTab === 'birthday') {
                html += `
                <div class="p-3 bg-purple-50/70 rounded-xl border-l-4 border-purple-400 shadow-sm">
                    <p class="font-bold text-purple-600 text-xs mb-1 flex items-center gap-1.5">
                        <i class="fa-solid fa-cake-candles"></i> 生日賀詞
                    </p>
                    <p class="leading-relaxed">${cardData.birthdayText}</p>
                </div>`;
            }

            if (currentTab === 'both') {
                html += `<p class="text-[11px] text-center text-gold-600 font-serif pt-1 tracking-wider">✦ 雙祝並臻 · 師恩難忘 · 生日快樂 ✦</p>`;
            }

            container.innerHTML = html;
            document.getElementById('displayTeacherName').innerText = `${cardData.name}：`;
            document.getElementById('coverTeacherName').innerText = cardData.name;
        }

        // --- 彈窗邏輯 ---
        function openEditModal() {
            document.getElementById('inputTeacherName').value = cardData.name;
            document.getElementById('inputTeacherText').value = cardData.teacherText;
            document.getElementById('inputBirthdayText').value = cardData.birthdayText;
            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
        }

        function saveCustomContent() {
            const name = document.getElementById('inputTeacherName').value.trim();
            const teacherText = document.getElementById('inputTeacherText').value.trim();
            const birthdayText = document.getElementById('inputBirthdayText').value.trim();

            if (name) cardData.name = name;
            if (teacherText) cardData.teacherText = teacherText;
            if (birthdayText) cardData.birthdayText = birthdayText;

            renderContent();
            closeEditModal();
        }

        // --- 禮花特效 ---
        function triggerConfetti(e) {
            let opts = {
                particleCount: 60,
                spread: 70,
                origin: { y: 0.7 }
            };

            if (e) {
                const rect = e.target.getBoundingClientRect();
                opts.origin = {
                    x: (rect.left + rect.width / 2) / window.innerWidth,
                    y: (rect.top + rect.height / 2) / window.innerHeight
                };
            }

            confetti({
                ...opts,
                colors: ['#D4AF37', '#E9D8FD', '#FED7D7', '#F6AD55']
            });
        }

        // --- 音效系統 (Web Audio API) ---
        let audioCtx = null;
        let isPlaying = false;
        let melodyInterval = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playBellSound() {
            initAudio();
            if (!audioCtx) return;

            const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
            notes.forEach((freq, idx) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + idx * 0.08);
                
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime + idx * 0.08);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + idx * 0.08 + 0.6);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime + idx * 0.08);
                osc.stop(audioCtx.currentTime + idx * 0.08 + 0.6);
            });
        }

        function toggleMusic() {
            initAudio();
            const musicBtn = document.getElementById('musicBtn');
            const musicIcon = document.getElementById('musicIcon');
            const musicText = document.getElementById('musicText');

            if (isPlaying) {
                clearInterval(melodyInterval);
                isPlaying = false;
                musicIcon.className = 'fa-solid fa-music';
                musicText.innerText = '播放音樂';
            } else {
                isPlaying = true;
                musicIcon.className = 'fa-solid fa-pause';
                musicText.innerText = '暫停音樂';

                // 和弦背景輕音樂
                const sequence = [
                    [261.63, 329.63, 392.00], // C
                    [220.00, 261.63, 329.63], // Am
                    [174.61, 220.00, 261.63], // F
                    [196.00, 246.94, 293.66]  // G
                ];
                let step = 0;

                melodyInterval = setInterval(() => {
                    const chord = sequence[step % sequence.length];
                    chord.forEach(freq => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                        gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.8);

                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start();
                        osc.stop(audioCtx.currentTime + 1.8);
                    });
                    step++;
                }, 2000);
            }
        }

        // --- 花瓣飄落動畫 (Canvas) ---
        function initPetals() {
            const canvas = document.getElementById('petalsCanvas');
            const ctx = canvas.getContext('2d');

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            resize();
            window.addEventListener('resize', resize);

            const petals = Array.from({ length: 25 }, () => ({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 6 + 4,
                speedY: Math.random() * 1 + 0.5,
                speedX: Math.random() * 0.5 - 0.25,
                angle: Math.random() * 360,
                spin: Math.random() * 2 - 1,
                color: ['rgba(212, 175, 55, 0.4)', 'rgba(233, 216, 253, 0.5)', 'rgba(254, 215, 215, 0.5)'][Math.floor(Math.random() * 3)]
            }));

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                petals.forEach(p => {
                    p.y += p.speedY;
                    p.x += p.speedX;
                    p.angle += p.spin;

                    if (p.y > canvas.height) p.y = -10;
                    if (p.x > canvas.width) p.x = 0;
                    if (p.x < 0) p.x = canvas.width;

                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate((p.angle * Math.PI) / 180);
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, p.size, p.size / 2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });

                requestAnimationFrame(animate);
            }
            animate();
        }
    </script>
</body>
</html>
